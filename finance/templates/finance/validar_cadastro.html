{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code</title>

    <script>try { document.documentElement.dataset.theme = localStorage.getItem('fintech-theme') || 'dark'; } catch (_) { document.documentElement.dataset.theme = 'dark'; }</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'style/default.css' %}?v=20261106-10">
    <link rel="stylesheet" href="{% static 'style/login.css' %}?v=20261106-2">
</head>

<body class="auth-page">
    <section class="auth-stage">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                    <div class="card auth-card">
                        <div class="card-body p-5 text-center">

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}

                            <form action="{% url 'finance:validar_cadastro' %}" method="post">
                                {% csrf_token %}

                                <div class="mb-md-5 mt-md-4 pb-5">

                                    <h2 class="fw-bold mb-2 text-uppercase">Verificação do código</h2>
                                    <p class="text-white-50 mb-5">
                                        Enviamos um código no seu endereço de email. Entre com ele para registrarmos sua conta
                                    </p>

                                    <!-- Token -->
                                    <div class="form-floating mb-4">
                                        <input
                                            type="text"
                                            id="typeTokenX"
                                            class="form-control form-control-lg"
                                            name="token"
                                            placeholder="Code"
                                            inputmode="numeric"
                                            required>
                                        <label for="typeTokenX" class="text-dark">
                                            Verificar código
                                        </label>
                                    </div>

                                    <button
                                        class="btn btn-auth-primary btn-lg px-5 mb-3"
                                        type="submit">
                                        Confirmar
                                    </button>

                                </div>

                            </form>

                            <!-- Formulário separado só pro reenvio -->
                            <form action="{% url 'finance:validar_cadastro' %}" method="post">
                                {% csrf_token %}
                                <button
                                    class="btn btn-link text-white-50"
                                    type="submit"
                                    name="reenviar"
                                    value="Reenviar">
                                    Reenviar código
                                </button>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
