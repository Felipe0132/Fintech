{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark">
    <section class="vh-100" style="background: linear-gradient(to right, #0f0c29, #302b63, #24243e);">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                    <div class="card bg-dark text-white" style="border-radius: 1rem;">
                        <div class="card-body p-5 text-center">
                            
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}

                            <form action="{% url 'finance:cadastro' %}" method="post">
                                {% csrf_token %}

                                <div class="mb-md-5 mt-md-4 pb-5">

                                    <h2 class="fw-bold mb-2 text-uppercase">Register</h2>
                                    <p class="text-white-50 mb-5">
                                        Create your account by filling in the fields below.
                                    </p>

                                    <!-- Username -->
                                    <div class="form-floating mb-4">
                                        <input
                                            type="text"
                                            id="typeUsernameX"
                                            class="form-control form-control-lg"
                                            name="username"
                                            placeholder="Username"
                                            required>
                                        <label for="typeUsernameX" class="text-dark">
                                            Username
                                        </label>
                                    </div>

                                    <!-- Email -->
                                    <div class="form-floating mb-4">
                                        <input
                                            type="email"
                                            id="typeEmailX"
                                            class="form-control form-control-lg"
                                            name="email"
                                            placeholder="Email"
                                            required>
                                        <label for="typeEmailX" class="text-dark">
                                            Email
                                        </label>
                                    </div>

                                    <!-- Password -->
                                    <div class="input-group mb-4">
                                        <input
                                            type="password"
                                            id="typePasswordX"
                                            class="form-control form-control-lg"
                                            name="password"
                                            placeholder="Password"
                                            minlength="8"
                                            required>
                                        <button
                                            class="btn btn-outline-light"
                                            type="button"
                                            onclick="togglePassword('typePasswordX', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>

                                    <!-- Confirm Password -->
                                    <div class="input-group mb-4">
                                        <input
                                            type="password"
                                            id="typeConfirmPasswordX"
                                            class="form-control form-control-lg"
                                            name="confirm_password"
                                            placeholder="Confirm password"
                                            required>
                                        <button
                                            class="btn btn-outline-light"
                                            type="button"
                                            onclick="togglePassword('typeConfirmPasswordX', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>

                                    <div id="passwordMismatch" class="text-danger small mb-3 d-none">
                                        Passwords do not match.
                                    </div>

                                    <button
                                        class="btn btn-outline-light btn-lg px-5"
                                        type="submit">
                                        Register
                                    </button>

                                </div>

                            </form>

                            <div>
                                <p class="mb-0">
                                    Already have an account?
                                    <a href="{% url 'finance:login' %}" class="text-white-50 fw-bold">
                                        Login
                                    </a>
                                </p>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector("i");
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            icon.classList.toggle("bi-eye", !isHidden);
            icon.classList.toggle("bi-eye-slash", isHidden);
        }

        // Basic client-side check before submitting (server should still validate)
        document.querySelector("form").addEventListener("submit", function (event) {
            const password = document.getElementById("typePasswordX").value;
            const confirmPassword = document.getElementById("typeConfirmPasswordX").value;
            const mismatchAlert = document.getElementById("passwordMismatch");

            if (password !== confirmPassword) {
                event.preventDefault();
                mismatchAlert.classList.remove("d-none");
            } else {
                mismatchAlert.classList.add("d-none");
            }
        });
    </script>
</body>

</html>
