{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinaTech</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('fintech-theme') || 'dark'; } catch (_) { document.documentElement.dataset.theme = 'dark'; }</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style/default.css' %}?v=20261106-10">
    <link rel="stylesheet" href="{% static 'style/login.css' %}?v=20261106-2">
</head>

<body class="auth-page">
    <section class="auth-stage">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="card auth-card">
                        <div class="card-body p-5 text-center">

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}

                            <form action="{% url 'finance:login' %}" method="post"> {% csrf_token %}
                                <div class="mb-md-5 mt-md-4 pb-5">
                                    <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                                    <p class="text-white-50 mb-5">Entre com seu e-mail e sua senha para acessar sua conta.</p>
                                    <div data-mdb-input-init class="form-outline form-white mb-4">
                                        <input type="email" id="typeEmailX" class="form-control form-control-lg"
                                            name="email" />
                                        <label class="form-label" for="typeEmailX">E-mail</label>
                                    </div>
                                    <div class="input-group mb-4">
                                        <input type="password" id="typePasswordX" class="form-control form-control-lg" name="password" placeholder="Senha" />
                                        <button
                                            class="btn btn-auth-eye"
                                            type="button"
                                            onclick="togglePassword('typePasswordX', this)">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <p class="small mb-5 pb-lg-2"><a class="text-white-50" href="{% url 'finance:password_reset' %}">Esqueceu sua senha?</a>
                                    </p>
                                    <button data-mdb-button-init data-mdb-ripple-init
                                        class="btn btn-auth-primary btn-lg px-5" type="submit">Entrar</button>
                                    <div class="d-flex justify-content-center text-center mt-4 pt-1">
                                        <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
                                        <a href="#!" class="text-white"><i
                                                class="fab fa-twitter fa-lg mx-4 px-2"></i></a>
                                        <a href="#!" class="text-white"><i class="fab fa-google fa-lg"></i></a>
                                    </div>
                                </div>
                            </form>

                            <div>
                                <p class="mb-0">Ainda não tem cadastro? <a href="{% url 'finance:cadastro' %}"
                                        class="text-white-50 fw-bold">Criar conta</a>
                                </p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector("i");
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            icon.classList.toggle("bi-eye", !isHidden);
            icon.classList.toggle("bi-eye-slash", isHidden);
        }
</script>

</html>
